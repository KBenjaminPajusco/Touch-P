name: Build APK

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain
      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: touchp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # Release "latest" mise à jour à chaque push de branche : l'APK se télécharge directement depuis le téléphone.
      - name: Publish rolling release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk touchp-debug.apk
          notes="Build automatique de ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          gh release delete latest-debug --cleanup-tag --yes || true
          gh release create latest-debug touchp-debug.apk --prerelease --target "$GITHUB_SHA" --title "Debug latest" --notes "$notes"
