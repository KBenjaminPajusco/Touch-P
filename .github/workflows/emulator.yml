name: Emulator test

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-boot-timeout: 900
          disable-animations: true
          script: ./scripts/emulator-test.sh app/build/outputs/apk/debug/app-debug.apk ci-out

      - name: Check detection results
        if: always()
        run: ./scripts/check-results.sh ci-out/results.txt | tee ci-out/check.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-output
          path: ci-out

      # Capture + logs publiés sur la branche ci-screens (un seul commit, écrasé à chaque run).
      - name: Publish screenshots to ci-screens
        if: always()
        run: |
          mkdir -p /tmp/pub && cp -r ci-out/. /tmp/pub/ && cd /tmp/pub
          echo "${GITHUB_REF_NAME} @ ${GITHUB_SHA} (run ${GITHUB_RUN_ID})" > SOURCE.txt
          rm -f logcat_full.txt.gz && gzip -k logcat_full.txt 2>/dev/null && rm -f logcat_full.txt
          git init -q -b ci-screens
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "CI emulator output for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screens
